<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemarchand's Box • NFT Interactive Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #070709; font-family: -apple-system, sans-serif; color: #fff; }
        #webglCanvas { width: 100vw; height: 100vh; display: block; cursor: grab; }
        #webglCanvas:active { cursor: grabbing; }
        
        .hud-overlay {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(15, 13, 18, 0.85);
            border: 1px solid #594726;
            padding: 8px 14px;
            border-radius: 4px;
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .hud-btn {
            background: #1e1914;
            border: 1px solid #594726;
            color: #d4af37;
            padding: 6px 12px;
            font-size: 0.78rem;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .hud-btn:hover {
            background: #36291a;
            border-color: #d4af37;
        }

        .token-tag {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(15, 13, 18, 0.85);
            border: 1px solid #594726;
            padding: 6px 14px;
            border-radius: 4px;
            color: #d4af37;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="token-tag" id="tokenTag">Lemarchand's Box #1</div>
    <canvas id="webglCanvas"></canvas>

    <div class="hud-overlay">
        <button class="hud-btn" id="btnStep">⚙️ Next Step</button>
        <button class="hud-btn" id="btnSolve">✨ Solve</button>
        <button class="hud-btn" id="btnReset">🔄 Re-Lock</button>
        <button class="hud-btn" id="btnBloom">🌸 Bloom</button>
        <button class="hud-btn" id="btnSummon">⛓️ Summon</button>
        <button class="hud-btn" id="btnAudio">🔇 Audio</button>
    </div>

    <script src="src/js/lib/three.min.js"></script>
    <script src="src/js/traits.js"></script>
    <script src="src/js/audio.js"></script>
    <script src="src/js/textures.js"></script>
    <script src="src/js/engine.js"></script>
    <script src="src/js/puzzle.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = Math.max(1, Math.min(1000, parseInt(params.get('id') || '1')));

            const canvas = document.getElementById('webglCanvas');
            const tokenTag = document.getElementById('tokenTag');
            
            const engine = new LemarchandEngine(canvas);
            const puzzle = new LemarchandPuzzle(engine, LemarchandAudio);
            
            const tokenData = LemarchandTraits.resolveTraits(id);
            tokenTag.textContent = `${tokenData.title}`;

            engine.buildBox(tokenData);
            puzzle.loadToken(tokenData);

            document.getElementById('btnStep').onclick = () => puzzle.stepForward();
            document.getElementById('btnSolve').onclick = () => puzzle.solve();
            document.getElementById('btnReset').onclick = () => puzzle.reset();
            document.getElementById('btnBloom').onclick = () => puzzle.bloom();
            document.getElementById('btnSummon').onclick = () => puzzle.summon();
            
            const btnAudio = document.getElementById('btnAudio');
            btnAudio.onclick = () => {
                const muted = LemarchandAudio.toggleMute();
                btnAudio.textContent = muted ? "🔇 Audio" : "🔊 Audio ON";
            };
        });
    </script>
</body>
</html>
